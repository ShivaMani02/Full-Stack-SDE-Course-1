version: '3.8'

services:
  mysql:
    image: mysql:8.1
    container_name: employee-management-mysql
    environment:
      MYSQL_ROOT_PASSWORD: changeit
      MYSQL_DATABASE: employee_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-management-api
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: changeit
      JWT_SECRET: SomeJWTSecretKeyForDemo1234567890MyVerySecureSecret
      JWT_EXPIRATION: 3600000
    ports:
      - "8080:8080"

volumes:
  mysql-data:
