<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-5">
      <div class="text-center mb-4">
        <h1 class="fw-bold">Expense Tracker</h1>
        <p class="text-muted">Track your expenses with a simple and responsive Bootstrap app.</p>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Add New Expense</h5>
          <form id="expense-form" class="row g-3">
            <div class="col-md-4">
              <label for="expense-name" class="form-label">Expense Name</label>
              <input type="text" class="form-control" id="expense-name" placeholder="e.g. Coffee" />
            </div>
            <div class="col-md-4">
              <label for="expense-amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="expense-amount" placeholder="0" min="0" />
            </div>
            <div class="col-md-4">
              <label for="expense-category" class="form-label">Category</label>
              <select class="form-select" id="expense-category">
                <option value="" selected>Select category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-primary">Add Expense</button>
            </div>
          </form>
        </div>
      </div>

      <div id="alert-container" class="mb-3"></div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Expense List</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th scope="col">Sr No.</th>
                  <th scope="col">Expense Name</th>
                  <th scope="col">Category</th>
                  <th scope="col">Amount</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>
              <tbody id="expense-table-body">
                <tr>
                  <td colspan="5" class="text-center text-muted py-4">No Expenses Added</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card border-primary shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h6 class="mb-1">Total Expenses</h6>
            <p class="mb-0 text-secondary">Sum of all added expenses</p>
          </div>
          <h3 class="mb-0 text-primary" id="total-amount">$0.00</h3>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
